name: Core engineering checks
on:
  push:
    branches:
      - 'release/v4.4.0-rc1'
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install pinned development toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build all formal clients
        run: npm run build
      - name: Static and cross-client integrity checks
        run: npm run check
      - name: Run Node regression suite
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install media test dependency
        run: pip install -r requirements-dev.txt
      - name: Run media pipeline regression
        run: python tests/media_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-engineering-evidence
          path: |
            audit/static-check.json
            audit/media-tests.json
            dist/build-manifest.json
          retention-days: 30
