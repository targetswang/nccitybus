name: Import v4.4 release source bundle
on:
  push:
    branches:
      - 'release/v4.4.0-rc1'
    paths:
      - '.release/**'
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v4.4.0-rc1
          fetch-depth: 0
      - name: Reassemble and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-* > /tmp/v4.4.0-rc1.tar.gz
          echo "64ef3520d84a27ac1e5aa7437e4a73d42eccebe019a0f442a8dcba344ce0d811  /tmp/v4.4.0-rc1.tar.gz" | sha256sum -c -
      - name: Replace release tree with canonical source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .release -exec rm -rf {} +
          tar -xzf /tmp/v4.4.0-rc1.tar.gz -C .
          rm -rf .release
      - name: Commit imported source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: import unified v4.4.0-rc1 full source"
          git push origin HEAD:release/v4.4.0-rc1
